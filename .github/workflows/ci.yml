name: CI

# This repository is a Kotlin Multiplatform *library* (androidLibrary + desktop JVM), not an
# Android application. There is no `app/` module, no APK, and no `test` task -- the real test
# tasks this project registers are `desktopTest` and the `allTests` aggregate over them (verified
# with `./gradlew tasks --all`). So this builds and tests the library, and publishes nothing:
# consumers resolve it from JitPack straight off a commit (see README), which builds on JitPack's
# own runners rather than here, so there is no release artifact for this workflow to produce.

on:
  # Pushes to main, and every pull request. Not `push: [**]` as well: with both, a branch that
  # has a PR open runs this workflow twice on the same commit, and the concurrency group below
  # cancels one of the two -- which reads on the PR as a cancelled check rather than as a
  # duplicate.
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          # Not generate-submit-and-upload: submitting a dependency snapshot needs
          # `contents: write`, which this workflow deliberately does not take (it publishes
          # nothing). Left on, it only logs `Resource not accessible by integration` every run.
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # `allTests` is the aggregate over every target's test run; on this project that is
      # `desktopTest` (the androidLibrary target declares no host test run).
      - name: Run tests
        run: ./gradlew allTests --continue --build-cache --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Every target's artifact, including the Android library variant -- the closest thing this
      # repository has to "does it still build for a consumer", which is what the replaced
      # `assembleDebug`/APK-release job was pretending to check.
      - name: Assemble all targets
        run: ./gradlew assemble --build-cache --no-daemon --stacktrace
